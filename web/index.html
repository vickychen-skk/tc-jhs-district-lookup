<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>臺中市國中學區查詢（教育局來源）</title>
  <style>
    body{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif; max-width:760px; margin:24px auto; padding:0 16px;}
    .row{margin:10px 0;}
    input,select,button{font-size:16px; padding:8px 10px;}
    button{cursor:pointer}
    .card{background:#f6f6f6; padding:12px; border-radius:10px; white-space:pre-wrap;}
    .muted{color:#666; font-size:13px;}
  </style>
</head>
<body>
  <h2>臺中市國中學區查詢（官方：教育局學區查詢頁）</h2>
  <div class="muted" id="meta">載入中…</div>

  <div class="row">
    <label>行政區：</label>
    <select id="district">
      <option>北區</option>
      <option>北屯區</option>
      <option>西區</option>
      <option>西屯區</option>
      <option>南屯區</option>
    </select>
  </div>

  <div class="row">
    <label>里：</label>
    <input id="li" placeholder="例如：何南里 / 明德里 / 公德里" />
  </div>

  <div class="row">
    <label>鄰：</label>
    <input id="lin" type="number" min="1" placeholder="例如：20" />
  </div>

  <div class="row">
    <button id="btn">查詢</button>
    <button id="upd">更新官方資料</button>
  </div>

  <div class="card" id="out">請輸入行政區＋里＋鄰後按「查詢」。</div>

  <script src="app.js"></script>
</body>
</html>
