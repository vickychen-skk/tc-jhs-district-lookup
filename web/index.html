<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>臺中市國中學區查詢</title>
  <style>
    body{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif; max-width:720px; margin:24px auto; padding:0 16px;}
    .row{margin:12px 0;}
    input,select,button{font-size:16px; padding:8px;}
    button{cursor:pointer}
    .box{background:#f5f5f5; padding:12px; border-radius:8px; white-space:pre-wrap;}
  </style>
</head>
<body>
  <h2>臺中市國中學區查詢</h2>

  <div class="row">
    行政區：
    <select id="district">
      <option>北區</option>
      <option>北屯區</option>
      <option>西區</option>
      <option>西屯區</option>
      <option>南屯區</option>
    </select>
  </div>

  <div class="row">
    里：<input id="li" placeholder="例如：明德里">
  </div>

  <div class="row">
    鄰：<input id="lin" type="number" placeholder="例如：10">
  </div>

  <div class="row">
    <button onclick="query()">查詢</button>
  </div>

  <div class="box" id="out">請輸入後按查詢</div>

<script>
async function query(){
  const d = document.getElementById('district').value;
  const li = document.getElementById('li').value;
  const lin = document.getElementById('lin').value;
  const out = document.getElementById('out');
  out.textContent = '查詢中…';

  const res = await fetch(`/api/query?district=${d}&li=${li}&lin=${lin}`);
  const data = await res.json();

  if(!data.ok){
    out.textContent = '❌ ' + data.error;
    return;
  }
  if(data.status === 'ok'){
    out.textContent = '✅ 國中：' + data.schools.join(', ');
  }else if(data.status === 'manual'){
    out.textContent = '⚠️ 需人工判定\n' + data.candidates.map(c=>c.raw).join('\n');
  }else{
    out.textContent = '❌ 查無資料';
  }
}
</script>
</body>
</html>
